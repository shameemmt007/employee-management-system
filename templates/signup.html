<!DOCTYPE html>
<html>
<head>
    <title>Admin Signup</title>
</head>
<body>

    <h2>Admin Registration</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

</body>
</html>
